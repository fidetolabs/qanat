services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qanat
      POSTGRES_PASSWORD: qanat
      POSTGRES_DB: qanat
    ports:
      # Host 5432 is often taken by a local Postgres install — default to 5433.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - qanat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qanat -d qanat"]
      interval: 3s
      timeout: 3s
      retries: 20

  qanat:
    build: .
    ports:
      - "${QANAT_HOST_PORT:-8421}:8421"
    environment:
      QANAT_HOST: 0.0.0.0
      QANAT_PORT: 8421
      # The MCP endpoint answers to localhost and 127.0.0.1 only. It binds 0.0.0.0
      # so the port mapping works, so reaching it by any other name -- a machine on
      # the network, a domain -- means naming that here, comma separated.
      QANAT_ALLOWED_HOSTS: ${QANAT_ALLOWED_HOSTS:-}
      # Required, and the container will not start without it: binding 0.0.0.0
      # names no host, so `qanat serve` refuses it unless a caller has to prove
      # who it is. Set it in the environment or a .env file beside this one.
      QANAT_MCP_TOKEN: ${QANAT_MCP_TOKEN:?set QANAT_MCP_TOKEN to serve MCP off loopback}
      QANAT_STORE: postgresql://qanat:qanat@postgres:5432/qanat
      QANAT_RESET: ${QANAT_RESET:-0}
      # The demo project pulls real 10-K filings from SEC EDGAR, which refuses
      # requests that do not say who is making them. No account, no API key --
      # a name and an email address. Without it the container starts and the
      # fetch fails.
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    volumes:
      - qanat_project:/project
    working_dir: /project
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  qanat_pg:
  qanat_project:
