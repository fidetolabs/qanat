# Publish to PyPI when a version tag is pushed.
#
# No API token anywhere. PyPI's trusted publishing verifies that the upload came
# from this workflow, in this repository, and mints a token that lives for the
# length of one job -- so there is nothing on a laptop to leak, and nothing to
# rotate.
#
# Set it up once. Until the first release there is no project page to configure,
# so it goes in as a *pending* publisher at pypi.org/manage/account/publishing/:
#
#     PyPI project name   qanat-fdtl        (the distribution, not the command)
#     Owner               fidetolabs
#     Repository          qanat
#     Workflow            release.yml
#     Environment         pypi
#
# After the first upload the same settings live at
# pypi.org/manage/project/qanat-fdtl/settings/publishing/.
#
# To release:
#     git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in pyproject.toml -- the job checks, and stops
# if they disagree, because a version published under the wrong tag cannot be
# taken back.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest

    # the same server the test workflow uses: without it tests/test_postgres.py
    # skips itself, and the last gate before a release would be the weaker one
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qanat
          POSTGRES_PASSWORD: qanat
          POSTGRES_DB: qanat
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U qanat -d qanat"
          --health-interval 3s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: the tag and pyproject must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # read it with grep, not tomllib: tomllib is 3.11+, and this project
          # supports 3.10, so the check must not be the thing that needs a newer one
          got=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag $tag · pyproject $got"
          [ "$tag" = "$got" ] || { echo "::error::tag v$tag does not match pyproject $got"; exit 1; }

      # a release is not the place to find out the tests fail
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      # -n auto spreads a test at a time across the runner's cores. The suite is
      # dominated by test_backtest.py, where every test replays a pipeline at each
      # of its rebalance dates -- 36 independent replays that were running one
      # after another. loadgroup keeps the Postgres file on a single worker; it
      # shares one database and resets by emptying it.
      - run: uv run pytest -q -n auto --dist loadgroup
        env:
          QANAT_TEST_PG: postgresql://qanat:qanat@127.0.0.1:5433/qanat

      - run: uv build
      - name: the wheel must carry the console
        run: |
          uv run python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[-1]).namelist()
          want = {"index.html", "dag.js", "console.js", "backtests.js", "alphaedit.js", "theme.css",
                  "thread.js", "data.js", "live.js", "conditions.js"}
          have = {n.rsplit("/", 1)[-1] for n in names if "/console/" in n}
          missing = want - have
          assert not missing, f"the wheel is missing {missing} -- it would install a blank console"
          print(f"console assets in the wheel: {len(have)}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # the environment is what PyPI checks against, so it has to match the name
    # given in the trusted-publisher settings
    environment: pypi
    permissions:
      id-token: write   # this is what mints the short-lived token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Pushing the tag published the package but left the repository showing the
  # previous version as Latest, because a tag is not a release -- so 0.1.3 sat on
  # PyPI for a day while GitHub still said 0.1.2. Doing it by hand is the kind of
  # step that gets forgotten exactly once per release.
  announce:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: the notes for this version, out of the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # everything between this version's heading and the next one
          awk -v v="## $version" '
            $0 ~ "^" v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          printf '\n---\n\nSource for `qanat-fdtl` %s on PyPI. Ledger: `audit/FINDINGS.md`\n' \
            "$version" >> notes.md
          echo "wrote $(wc -l < notes.md) lines of notes"

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --latest --notes-file notes.md
