name: test
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "${{ matrix.python }}"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests audit
      # -n auto spreads a test at a time across the runner's cores. loadgroup is
      # kept because a test file that shares one resource has to stay on one
      # worker; nothing needs it today and it costs nothing.
      - run: uv run pytest -q -n auto --dist loadgroup

      # The same suite, same assertions, parquet underneath. Equivalence is the
      # claim -- a storage kind that passes its own tests and quietly fails the
      # real ones is worse than not having it. Costs one more run of a suite
      # that takes ten seconds.
      - name: the whole suite again, on parquet
        run: uv run pytest -q -n auto --dist loadgroup
        env:
          QANAT_TEST_STORE: parquet

  # Every job above runs `uv sync --frozen`, which is why 0.10.0 shipped broken:
  # the lock pinned duckdb 1.5.5, a `uv tool install` resolved 2.0.0, and CI
  # could not see the difference. A `>=`-only dependency cannot fail a frozen
  # job -- it fails users. So this one resolves the way a visitor does.
  #
  # The lock now spans both duckdb majors on its own -- 2.x needs Python 3.12,
  # so the matrix above gets 1.5.6 on 3.10 and 2.0.0 on 3.12. That is the better
  # guard and it was a consequence of this job, not a replacement for it: what
  # is still invisible to a frozen job is the major that has not shipped yet.
  #
  # `continue-on-error`, deliberately: a dependency releasing a breaking major is
  # not this push being wrong, and a red mark on an unrelated PR would get this
  # job deleted inside a month. It is here to be *looked at*.
  unpinned:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv python install 3.12

      - name: what a fresh install resolves
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run --no-sync python -c "import duckdb; print('duckdb', duckdb.__version__)"

      - name: the suite, on whatever that was
        run: uv run --no-sync pytest -q -n auto --dist loadgroup

      - name: and on parquet
        run: uv run --no-sync pytest -q -n auto --dist loadgroup
        env:
          QANAT_TEST_STORE: parquet

      # The major the bound keeps us off, read out of pyproject rather than
      # written here -- hardcoding it is how this step goes stale the first time
      # the bound moves. When this passes, that is the evidence to widen on.
      #
      # A major that does not exist yet is the expected case and is reported, not
      # failed: this step is a watch on upstream, and "nothing to try" is a
      # perfectly good answer from a watch.
      - name: the major the bound excludes, if it exists
        run: |
          cap="$(grep -oE '"duckdb>=[^"]+"' pyproject.toml | grep -oE '<[0-9]+' | tr -d '<')"
          if [ -z "$cap" ]; then echo "no upper bound in pyproject -- nothing excluded"; exit 0; fi
          echo "the bound excludes duckdb >=${cap}"
          if ! uv pip install --no-deps "duckdb>=${cap},<$((cap + 1))"; then
            echo "no duckdb ${cap}.x release yet -- nothing to try, which is the usual answer"
            exit 0
          fi
          uv run --no-sync python -c "import duckdb; print('duckdb', duckdb.__version__)"
          uv run --no-sync pytest -q -n auto --dist loadgroup

  # The standing chaos batteries. Slower than the suite above and one of them calls
  # live public APIs, so they run once rather than across the matrix -- their job is
  # to notice a regression in ground a past audit already covered, not to gate a
  # push. See audit/README.md.
  batteries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev

      # Offline first: if this fails, something in the engine moved.
      - name: the batteries that need nothing but the code
        run: uv run pytest audit/batteries -m "audit and not network" -q

      # And the live shapes. A third party being down is not qanat being broken,
      # so this reports without failing the run.
      - name: the shapes the public web answers in
        continue-on-error: true
        run: uv run pytest audit/batteries -m "audit and network" -q
