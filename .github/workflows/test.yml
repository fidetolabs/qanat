name: test
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "${{ matrix.python }}"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests audit
      # -n auto spreads a test at a time across the runner's cores. loadgroup is
      # kept because a test file that shares one resource has to stay on one
      # worker; nothing needs it today and it costs nothing.
      - run: uv run pytest -q -n auto --dist loadgroup

      # The same suite, same assertions, parquet underneath. Equivalence is the
      # claim -- a storage kind that passes its own tests and quietly fails the
      # real ones is worse than not having it. Costs one more run of a suite
      # that takes ten seconds.
      - name: the whole suite again, on parquet
        run: uv run pytest -q -n auto --dist loadgroup
        env:
          QANAT_TEST_STORE: parquet

  # The standing chaos batteries. Slower than the suite above and one of them calls
  # live public APIs, so they run once rather than across the matrix -- their job is
  # to notice a regression in ground a past audit already covered, not to gate a
  # push. See audit/README.md.
  batteries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev

      # Offline first: if this fails, something in the engine moved.
      - name: the batteries that need nothing but the code
        run: uv run pytest audit/batteries -m "audit and not network" -q

      # And the live shapes. A third party being down is not qanat being broken,
      # so this reports without failing the run.
      - name: the shapes the public web answers in
        continue-on-error: true
        run: uv run pytest audit/batteries -m "audit and network" -q
