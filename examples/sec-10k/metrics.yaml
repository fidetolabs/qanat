metrics:
- id: pe
  origin: shipped
  version: 3
  unit: ratio
  description: 'price as it printed on the filing date, over diluted EPS for the year
    reported. Uses close_as_printed, not close: the EPS comes from a filing and the
    SEC never rewrites one, so the price must be on the same footing.

    '
  sql: "SELECT subject, close / NULLIF(eps, 0) AS value FROM (\n  SELECT f.subject,\
    \ f.value AS eps, p.close_as_printed AS close,\n         row_number() OVER (PARTITION\
    \ BY f.subject\n                            ORDER BY f.as_of DESC, f.period_end\
    \ DESC) AS rn\n  FROM normalized__facts f\n  JOIN normalized__filing_prices p\
    \ ON p.document = f.document\n  WHERE f.concept = 'us-gaap:EarningsPerShareDiluted'\n\
    \    AND f.dims = '{}' AND NOT f.is_instant\n    AND date_diff('day', f.period_start,\
    \ f.period_end) BETWEEN 350 AND 380\n    AND f.as_of <= :as_of\n) WHERE rn = 1\n"
- id: net_margin
  origin: shipped
  version: 2
  unit: ratio
  description: net income over revenue, for the year reported
  sql: "WITH annual AS (\n  SELECT subject, concept, value, as_of, period_end\n  FROM\
    \ normalized__facts\n  WHERE dims = '{}' AND NOT is_instant\n    AND date_diff('day',\
    \ period_start, period_end) BETWEEN 350 AND 380\n    AND as_of <= :as_of\n), ni\
    \ AS (\n  SELECT subject, value, row_number() OVER (PARTITION BY subject\n   \
    \        ORDER BY as_of DESC, period_end DESC) AS rn\n  FROM annual WHERE concept\
    \ = 'us-gaap:NetIncomeLoss'\n), rev AS (\n  -- Whichever revenue tag this filer\
    \ uses. Preferring the contract tag\n  -- when both are present keeps one company\
    \ on one definition.\n  SELECT subject, value, row_number() OVER (PARTITION BY\
    \ subject\n           ORDER BY as_of DESC, period_end DESC,\n           CASE concept\n\
    \             WHEN 'us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax'\
    \ THEN 0\n             ELSE 1 END) AS rn\n  FROM annual\n  WHERE concept IN ('us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax',\n\
    \                    'us-gaap:Revenues')\n)\nSELECT ni.subject, ni.value / NULLIF(rev.value,\
    \ 0) AS value\nFROM ni JOIN rev ON rev.subject = ni.subject AND rev.rn = 1\nWHERE\
    \ ni.rn = 1\n"
