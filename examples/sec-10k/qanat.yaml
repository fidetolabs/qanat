# Forty real 10-K filings: eight companies, five years each, straight from EDGAR.
#
#   qanat check                # the contract
#   qanat schedule --run-now   # fetch, parse, split. First pass is ~10 minutes
#   qanat mcp --scope research # hand it to an agent
#
# Nothing here is invented and nothing is bundled. The documents are downloaded
# from the SEC on the first run and cached under data/documents, so a second run
# touches the network only to look for filings it has not seen.
project: sec_10k
# A directory: the tables are parquet files read by DuckDB, so an ingest
# running does not stop anybody querying.
store: ./data

# ------------------------------------------------------------------ the stages --
# Two. The landed layer holds documents exactly as they arrived; the layer above
# holds the facts and the text pulled out of them. There is no metrics layer and
# no results layer: a metric is a query over facts, and a screen is a call that
# returns a list.
stages:
- id: raw
  kind: raw
  description: one row per filing, and the document itself gzipped on disk
- id: normalized
  kind: normalized
  description: the tagged numbers, and the document split into its Items

# ------------------------------------------------------------------- the clock --
# Without this line the as-of views would not filter `documents` at all, and
# every replay would read every filing ever made -- including ones published
# after the day it is pretending to be.
#
# `published_at` is the right column because it is the day the numbers became
# knowable. `period_end` is what they are *about*, which is a different question
# and never a permission to see them. The gap is not small: Costco's 2025 fiscal
# year ends 31 August and the filing lands 8 October, five weeks later.
time_columns:
  raw.documents: published_at
  raw.prices: as_of
  normalized.facts: as_of
  normalized.filing_prices: as_of
  normalized.spans: as_of

# --------------------------------------------------------- the ingestion job --
# What to fetch and where it lands. The cadence, if any, is a `job_schedules:`
# row pointing at this id -- not a field here.
corpus:
  documents: raw.documents
  spans: normalized.spans
  facts: normalized.facts

# ----------------------------------------------------------------- the return --
# Where a screen finds what a company did after it passed. The dates are each
# company's own filing dates, because Costco files in October and Walmart in
# March, and pricing them on a shared calendar would measure twelve months for
# one against sixteen for another.
returns:
  table: normalized.filing_prices
  subject_column: subject
  date_column: as_of
  # adjusted_close here, not close_as_printed: a split is not a loss, and a
  # return measured on printed prices would report one.
  price_column: adjusted_close

# ----------------------------------------------------------------- the metrics --
# A formula with a name and a version. Arithmetic, no judgement: the judgement
# is the threshold a caller puts next to it, and that never lives here.
#
# `:as_of` is replaced with the date being screened. Each one selects `subject`
# and `value`, one row per company.
#
# Two things both of these have to get right, and both were wrong first time.
#
# **A 10-K reports three years, all stamped with the same filing date.** So
# `order by as_of desc` alone picks an arbitrary one of the three. The tiebreak
# on `period_end` is what makes it the year actually being reported.
#
# **Filers do not agree on a revenue tag.** NVIDIA uses `Revenues`; Apple and
# most others use `RevenueFromContractWithCustomerExcludingAssessedTax`. Taking
# one and not the other silently dropped NVIDIA's revenue and produced a 271%
# net margin. Mapping plain names onto the tags filers really use is the large
# piece of work here, and these two metrics are a worked example of it, not a
# finished map.
# ----------------------------------------------------------------- the metrics --
# A formula with a name and a version. Shared: `price / diluted EPS` is
# arithmetic, so it is the same number for every caller. The threshold you
# compare it against is the judgement, and that is yours -- it travels with the
# screen call and is never stored here.
#
# `origin: shipped` marks these two as the **starter set**: enough to screen
# with on the day you install, and deliberately not a metric library. A
# definition you write is labelled `defined`, and does not join this set by
# being stored beside it.
